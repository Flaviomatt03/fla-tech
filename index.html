<style>
:root{--bg:#ffffff;--panel:#f6f7f9;--panel2:#eceef2;--line:#e4e7ec;--tx:#23272e;--dim:#7b8591;
--blue:#a9d6ef;--blue-d:#2f6a8f;--yellow:#f2d675;--yellow-d:#4a3c06;--yel-line:#dcbd52;--green:#5fae88;--pink:#f2b8c8;--pink-d:#4d1b2d;--lilac:#d3c8f1;--lilac-d:#2f2554;--beige:#e7d5ab;--beige-d:#4a3822;--mint:#bfe3cf;--mint-d:#14402b;--red:#d67d7d;
--shadow:0 10px 30px rgba(35,39,46,.08);
--sans:ui-rounded,'SF Pro Rounded','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html[data-theme=dark]{--bg:#1e2024;--panel:#2a2d32;--panel2:#34373d;--line:#3b3f46;--tx:#eceff3;--dim:#98a0aa;
--blue:#86bddd;--blue-d:#173a52;--yellow:#e4c96e;--yellow-d:#3b3005;--yel-line:#c9ad52;--green:#7fc7a1;--pink:#e39fb4;--pink-d:#3f1424;--lilac:#b4a6dd;--lilac-d:#241a45;--beige:#cdb88a;--beige-d:#2f2314;--mint:#8fc9a9;--mint-d:#0e2e1f;--red:#e48f8f;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);transition:background .4s,color .4s;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
svg{display:block}

/* ---------- HUB ---------- */
#hub{position:fixed;inset:0;background:var(--bg);overflow:hidden;transition:background .4s}
.tbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:grid;place-items:center;cursor:pointer;z-index:3}
.tbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn .moon{display:none}
html[data-theme=dark] .tbtn .sun{display:none}
html[data-theme=dark] .tbtn .moon{display:block}
.tri{position:absolute;left:50%;top:50%;width:min(80vw,420px,58dvh);aspect-ratio:1;transform:translate(-50%,-50%);transition:transform .95s cubic-bezier(.65,0,.2,1);border:0;background:none;padding:0;cursor:pointer;z-index:2;outline:none}
.tri svg{width:100%;height:100%;overflow:visible;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 16px 26px rgba(70,130,170,.28))}
.tri:active{filter:brightness(.97)}
#hub.open .tri{transform:translate(-50%,calc(-50% - 3dvh)) scale(.5)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1.8deg)}}
.hintx{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);left:0;right:0;text-align:center;color:var(--dim);font-size:14px;letter-spacing:.02em;transition:opacity .4s}
#hub.open .hintx{opacity:0}
.parla{white-space:nowrap;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);display:flex;align-items:center;gap:10px;padding:16px 26px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:700 17px var(--sans);box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,transform .6s cubic-bezier(.34,1.56,.64,1)}
.parla svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#hub.open .parla{opacity:1;pointer-events:auto;transform:translate(-50%,0);transition-delay:.9s}
.shapes{position:absolute;inset:0;pointer-events:none;--ux:min(1vw,7px);--uy:min(1dvh,9px)}
.shape{--s:clamp(100px,28vw,140px);position:absolute;left:50%;top:calc(50% - 3dvh);width:var(--s);height:var(--s);border:0;cursor:pointer;opacity:0;transform:translate(-50%,-50%) scale(.15);
transition:transform .85s cubic-bezier(.34,1.45,.64,1),opacity .4s;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.01em;outline:none;z-index:1}
#hub.open .shape{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--x)*var(--ux)),calc(var(--y)*var(--uy)));pointer-events:auto;transition-delay:calc(.35s + var(--i)*.1s);animation:bob 6s ease-in-out calc(1.6s + var(--i)*.7s) infinite}
#hub.open .shape:active{transform:translate(-50%,-50%) translate(calc(var(--x)*var(--ux)),calc(var(--y)*var(--uy))) scale(.95);transition-delay:0s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -9px}}
.sq{background:var(--yellow);color:var(--yellow-d);border-radius:32px;box-shadow:var(--shadow)}
.re{width:calc(var(--s)*1.3);height:calc(var(--s)*.58);background:var(--pink);color:var(--pink-d);border-radius:28px;box-shadow:var(--shadow)}
#appwrap.pink{background:var(--pink)}
.cal{flex:1;overflow:auto;padding:4px 16px 24px}
.cmh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cmh b{font-size:19px;text-transform:capitalize}
.cmh button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:20px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg .dw{font-size:12px;color:var(--dim);padding:4px 0}
.cg button{aspect-ratio:1;border:0;border-radius:14px;background:transparent;color:var(--tx);font:600 15px var(--sans);cursor:pointer;position:relative}
.cg button.t{outline:2px solid var(--pink)}
.cg button.sel{background:var(--pink);color:var(--pink-d)}
.cg button.has::after{content:'';position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pink-d);opacity:.6}
.cg button.sel.has::after{background:var(--pink-d);opacity:1}
.cev{margin-top:18px}.cev h4{margin:0 0 10px;font-size:16px;text-transform:capitalize}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.ev .tm{font-weight:800;min-width:46px;color:var(--dim)}.ev .tx{flex:1}
.ev button{border:0;background:transparent;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 8px}

/* ---------- APP (Finanze) ---------- */
#appwrap{position:fixed;inset:0;z-index:8;display:none;background:var(--yellow)}
#appwrap.on{background:var(--bg)}
#root{height:100%;display:flex;flex-direction:column;opacity:0}
#appwrap.on #root{opacity:1;transition:opacity .35s .3s}
header.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.back{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:26px;height:26px}
.ttl{flex:1;font-weight:800;font-size:21px;letter-spacing:-.01em}
.hbtns{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 15px;font-weight:700;font-size:13px;cursor:pointer}
.pill.acc{background:var(--yellow);color:var(--yellow-d);border-color:var(--yel-line)}
main#view{flex:1;overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}
.hero{background:var(--panel);background:linear-gradient(160deg,color-mix(in srgb,var(--yellow) 34%,var(--panel)),var(--panel) 70%)}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-bottom:10px;text-transform:uppercase}
.hero .big{font-size:clamp(36px,12vw,54px);font-weight:800;letter-spacing:-.02em}
.hero .big.neg{color:var(--red)}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:14px 0 12px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .6s}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim)}
.row b{color:var(--tx);font-weight:700}
.dim{color:var(--dim);font-size:13px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini .card{margin:0;padding:16px}
.mini .v{font-size:22px;font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .n{font-size:15px;font-weight:600}
.item .m{font-size:12px;color:var(--dim);margin-top:3px}
.item .a{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--yellow);color:var(--yellow-d);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.acts{display:flex;gap:8px;padding:0 0 12px}
.day{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin:18px 4px 8px;text-transform:uppercase}
.btn{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:15px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--yellow);border-color:var(--yel-line);color:var(--yellow-d)}
.btn.sm{width:auto;padding:10px 16px;font-size:13px}
.btn.dng{color:var(--red)}
.empty{color:var(--dim);font-size:14px;line-height:1.55}
nav.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;margin:6px 14px calc(12px + env(safe-area-inset-bottom));padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}
nav.nav .t{background:none;border:0;padding:13px 4px;font-size:13px;font-weight:700;color:var(--dim);border-radius:20px;cursor:pointer}
nav.nav .t.on{background:var(--yellow);color:var(--yellow-d)}
.mic{width:64px;height:64px;margin:-36px auto 0;border-radius:50%;background:var(--yellow);border:5px solid var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0}
.mic svg{width:26px;height:26px;stroke:var(--yellow-d);fill:none;stroke-width:2;stroke-linecap:round}
.mic.live{animation:pulse 1.1s infinite;background:var(--green)}
@keyframes pulse{50%{transform:scale(1.1)}}

/* ---------- sheet, forms, auth ---------- */
#sheetbg{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));z-index:21;display:none}
#sheet h3{margin:0 0 16px;font-size:18px;font-weight:800}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-bottom:12px;text-transform:uppercase}
input,select{display:block;width:100%;margin-top:7px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--yel-line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.chk{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--tx);font-weight:600}
label.chk input{width:22px;height:22px;margin:0;accent-color:var(--yellow-d)}
.auth{flex:1;overflow:auto;width:100%;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 22px 30px}
.auth .back{margin-bottom:26px}
.auth .logo{width:64px;height:64px;margin-bottom:12px}
.auth h1{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.auth p{color:var(--dim);font-size:15px;line-height:1.55;margin:0 0 22px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0 10px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);border-radius:99px;padding:11px 18px;font-size:14px;font-weight:600;z-index:30;display:none;max-width:88vw}
.vtr{min-height:24px;color:var(--dim);font-size:15px;margin-bottom:10px;font-style:italic}
.vout{min-height:50px;font-size:16px;line-height:1.5;font-weight:600;margin-bottom:14px}
.hint{font-size:13px;color:var(--dim);line-height:1.9;margin-top:14px}
.hint code{display:inline-block;white-space:nowrap;background:var(--panel2);border-radius:8px;padding:2px 8px;margin:0 2px;color:var(--tx);font-size:12px;font-family:inherit;font-weight:600;line-height:1.5}
.vmic{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}

.rbtn{right:auto;left:16px}.rbtn i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:var(--pink-d);font:800 12px/20px var(--sans);font-style:normal;text-align:center;padding:0 5px}
.rstrip{position:absolute;top:calc(env(safe-area-inset-top) + 68px);left:16px;right:16px;margin:0 auto;max-width:440px;padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:center;cursor:pointer;z-index:3;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hub.open .rstrip{opacity:0;pointer-events:none}
.ov{width:calc(var(--s)*1.35);height:calc(var(--s)*.85);background:var(--lilac);color:var(--lilac-d);border-radius:50%;box-shadow:var(--shadow);line-height:1.15;padding:0 14px}
.ci{background:var(--beige);color:var(--beige-d);border-radius:50%;box-shadow:var(--shadow)}
#appwrap.lilac:not(.on){background:var(--lilac)}#appwrap.beige:not(.on){background:var(--beige)}
.syn{font-size:12.5px;color:var(--dim);text-align:center;margin:18px 0 4px;line-height:1.5}
.wx{flex:1;overflow:auto;padding:4px 16px 28px;max-width:540px;margin:0 auto;width:100%}
.wsub{text-align:center;color:var(--dim);font-size:14px}
.wnow{text-align:center;padding:8px 0 4px}.wnow .ic{font-size:56px}.wnow .big{font-size:78px;font-weight:800;line-height:1.05}.wnow .ds{font-size:19px;font-weight:700;margin-top:2px}.wnow .sm{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.6}
.wh{margin:20px 0 10px;font-size:16px}
.wd{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.wd .dn{min-width:42px;font-weight:800;text-transform:capitalize}.wd .wi{font-size:24px}.wd .wt{flex:1;color:var(--dim);font-size:14px}.wd .tp{font-weight:800}.wd .tp small{color:var(--dim);font-weight:600}
.moonc{display:flex;gap:18px;align-items:center;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}.moonc svg{width:92px;height:92px;flex:none}.moonc b{font-size:19px}.moonc p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.55}
.ash{flex:1;overflow:auto;padding:4px 16px 120px;max-width:560px;margin:0 auto;width:100%}
.ash input,.ash textarea,.ash select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;width:100%;min-width:0}
.ash textarea{resize:vertical;line-height:1.45}
.ah{display:grid;gap:8px;margin-bottom:12px}.ah .an{font-size:28px;font-weight:800;border:0;background:transparent;padding:4px 0}.ah .as{display:flex;align-items:center;gap:12px;font-weight:700}.ah .as button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer}.asub{font-size:14px}
.adv{display:flex;gap:6px;margin:6px 0 14px}.adv button{flex:1;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;cursor:pointer}.adv button.on{background:var(--beige);color:var(--beige-d);border-color:var(--beige)}
.acd{padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.hpb{display:flex;align-items:center;justify-content:space-between;gap:10px}.hpb button{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);font-size:28px;font-weight:700;cursor:pointer}
.hpn{text-align:center}.hpn b{font-size:48px;font-weight:800;line-height:1}.hpn span{display:block;color:var(--dim);font-size:14px;margin-top:2px}
.bar{height:10px;border-radius:5px;background:var(--panel2);margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .3s}
.hpa{display:flex;gap:8px;margin-bottom:12px}.hpa input{flex:1}.hpa button,.abtn{padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer}
.abtn{width:100%}.abtn.on{background:var(--beige);color:var(--beige-d);border-color:var(--beige)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two label{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.st{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;cursor:default}
button.st{cursor:pointer;font:inherit;color:inherit}.st span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}.st b{font-size:24px}.st small{font-size:10.5px;color:var(--dim)}.st input{margin-top:2px;padding:4px 6px;font-size:12px;text-align:center}
.ahh{margin:22px 0 10px;font-size:16px}.ahh small{font-weight:500;color:var(--dim);font-size:12px}
.abs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.ab span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}.ab input{text-align:center;font-size:18px;font-weight:700;padding:5px}.ab button{width:100%;padding:7px;border-radius:12px;border:0;background:var(--beige);color:var(--beige-d);font:800 18px var(--sans);cursor:pointer}
.lst .rw{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.rw span{flex:1;min-width:0}.rw span i{font-style:normal;color:var(--dim);font-size:12px}.cnt{min-width:58px;text-align:right}
.rb{min-width:48px;height:38px;padding:0 10px;border-radius:12px;border:0;background:var(--beige);color:var(--beige-d);font:800 16px var(--sans);cursor:pointer}.rb.x{background:transparent;color:var(--dim);min-width:34px;font-size:20px}.rb.wide{min-width:74px;font-size:14px}
.pd{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);background:transparent;flex:none;cursor:pointer;padding:0}.pd.s1{background:var(--beige-d);border-color:var(--beige-d)}.pd.s2{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--green)}
html[data-theme=dark] .pd.s1{background:var(--beige);border-color:var(--beige)}
.dsv{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dsv span{font-size:13px;color:var(--dim);font-weight:700}.dd{width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);background:transparent;cursor:pointer;padding:0}.dd.on{background:var(--green);border-color:var(--green)}.dd.f.on{background:var(--red);border-color:var(--red)}

/* ---------- auth & api ---------- */
function saveSession(j){S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};lset('flat_s',S)}
async function authPost(path,body,tok){
  const h={apikey:KEY,'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
  let j={};try{j=await r.json()}catch{}return{ok:r.ok,status:r.status,j};
}
async function refresh(){if(!S||!S.refresh_token)return false;try{const r=await authPost('token?grant_type=refresh_token',{refresh_token:S.refresh_token});if(r.ok){saveSession(r.j);return true}}catch{}return false}
function dropSession(){S=null;ldel('flat_s')}
async function api(path,opt={},retry=true){
  if(!S)throw new Error('auth');
  if(S.expires_at-60<Date.now()/1000){if(!(await refresh())){dropSession();throw new Error('auth')}}
  const h=Object.assign({apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(SB+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&retry){if(await refresh())return api(path,opt,false);dropSession();throw new Error('auth')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}
  if(!r.ok)throw new Error((j&&j.message)||('Errore '+r.status));
  return j;
}
const rpc=(n,b)=>api('rpc/'+n,{method:'POST',body:JSON.stringify(b||{})});

async function loadAll(){
  const[e,i]=await Promise.all([api('expenses?select=*&order=spent_on.desc,created_at.desc&limit=2000'),api('incomes?select=*&order=received_on.desc,created_at.desc&limit=500')]);
  D.exp=(e||[]).map(x=>Object.assign(x,{amount:+x.amount}));D.inc=(i||[]).map(x=>Object.assign(x,{amount:+x.amount}));
}
function cycles(){
  const st=[...new Set(D.inc.filter(i=>i.source==='stipendio').map(i=>i.received_on))].sort();
  return st.map((s,k)=>{const e=st[k+1]||null,inR=d=>d>=s&&(!e||d<e);
    const inc=D.inc.filter(i=>inR(i.received_on)),exp=D.exp.filter(x=>inR(x.spent_on));
    const income=sum(inc),spent=sum(exp);return{start:s,end:e,income,spent,left:income-spent,exp,inc,current:!e}});
}
const curCycle=()=>{const c=cycles();return c[c.length-1]||null};
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function fixedInfo(){
  const cs=cycles(),map=new Map();
  cs.forEach((c,ci)=>c.exp.forEach(x=>{const k=(x.merchant||x.category||'').trim().toLowerCase();if(!k)return;
    if(!map.has(k))map.set(k,{label:x.merchant||x.category,per:new Map(),flag:false,last:x});
    const m=map.get(k);m.per.set(ci,(m.per.get(ci)||0)+x.amount);if(x.is_fixed)m.flag=true;if(x.spent_on>=m.last.spent_on)m.last=x}));
  return[...map.values()].map(m=>{const v=[...m.per.values()];return{label:m.label,cycles:v.length,avg:v.reduce((a,b)=>a+b,0)/v.length,flag:m.flag,last:m.last}})
    .filter(m=>m.cycles>=2||m.flag).sort((a,b)=>b.avg-a.avg);
}

function viewSpese(){
  if(!D.exp.length)return`<section class="card"><div class="lab">Spese</div><div class="empty">Ancora nessuna spesa. Tocca "+ spesa" o usa il microfono.</div></section>`;

  if(cs.length<2)h+=`<section class="card"><div class="empty">Con un solo stipendio registrato non posso ancora vedere cosa si ripete. Dopo il prossimo stipendio ti mostro le spese presenti in più cicli. Intanto puoi segnare come fisse quelle che già sai (tocca una spesa, poi "Segna fissa").</div></section>`;

function viewCicli(){

}

/* ---------- voce ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,tw=null;
const MALE=/\b(luca|cosimo|diego|giorgio|paolo|marco|male|uomo|lorenzo|gianni|stefano|google italiano)\b/i,FEM=/\b(elsa|isabella|alice|federica|elisa|female|donna|francesca|silvia|chiara|paola)\b/i;
let vCache=[];
function itVoices(){try{for(const x of speechSynthesis.getVoices())if(/^it/i.test(x.lang)&&!vCache.some(c=>c.name===x.name))vCache.push(x)}catch{}return vCache}
function pickVoice(){const v=itVoices();if(!v.length)return null;const sv=lget('flat_vname');if(sv){const f=v.find(x=>x.name===sv);if(f)return f}
  const sc=x=>(/natural|neural|online/i.test(x.name)?4:0)+(/(diego|cosimo|luca|giorgio)/i.test(x.name)?5:0)+(MALE.test(x.name)&&!FEM.test(x.name)?3:0)-(FEM.test(x.name)?6:0)+(x.localService?1:0);
  return v.slice().sort((a,b)=>sc(b)-sc(a))[0]}
let spTok=0,badV=new Set();
function speak(t,fb){const tok=++spTok;aiSet('speak');if(!voiceOn||!('speechSynthesis' in window)){setTimeout(()=>{if(tok===spTok)aiSet('idle')},Math.min(6000,1400+t.length*40));return}
  try{speechSynthesis.cancel();const parts=(t.replace(/\s+/g,' ').match(/[^.!?;:]+[.!?;:]*/g)||[t]).map(x=>x.trim()).filter(Boolean);let v=fb?null:pickVoice();if(v&&badV.has(v.name))v=itVoices().find(x=>!badV.has(x.name))||null;
    setTimeout(()=>{if(tok!==spTok)return;let started=false,failed=false;
      const retry=()=>{if(failed||tok!==spTok)return;failed=true;if(v)badV.add(v.name);speechSynthesis.cancel();if(!fb)speak(t,true);else aiSet('idle')};

const U={zero:0,uno:1,una:1,un:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,sedici:16,diciassette:17,diciotto:18,diciannove:19,venti:20,trenta:30,quaranta:40,cinquanta:50,sessanta:60,settanta:70,ottanta:80,novanta:90};
function wordNum(t){
  let tot=0,cur=0,got=false;
  for(const w of t.split(/\s+/)){
    let m;
    if(w in U){cur+=U[w];got=true}
    else if((m=w.match(/^(vent|trent|quarant|cinquant|sessant|settant|ottant|novant)[ia]?(uno|un|due|tre|quattro|cinque|sei|sette|otto|nove)$/))){cur+=({vent:20,trent:30,quarant:40,cinquant:50,sessant:60,settant:70,ottant:80,novant:90})[m[1]]+U[m[2]];got=true}
    else if((m=w.match(/^(due|tre|quattro|cinque|sei|sette|otto|nove)cento$/))){cur+=U[m[1]]*100;got=true}
    else if(w==='cento'){cur=(cur||1)*100;got=true}
    else if(w==='mille'){tot+=(cur||1)*1000;cur=0;got=true}
    else if(w==='e'&&got){continue}
    else if(got)break;
  }
  return got?tot+cur:null;
}
function findAmount(t){
  let m=t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?)/);
  if(m)return{n:parseFloat(m[1].replace(/\./g,'').replace(',','.')),raw:m[1]};
  m=t.match(/(\d+(?:[.,]\d{1,2})?)/);
  if(m)return{n:parseFloat(m[1].replace(',','.')),raw:m[1]};
  const n=wordNum(t);return n?{n,raw:null}:null;
}

      return'Nel ciclo hai speso '+say$(c.spent)+'.';
    }
  }
  if(amt&&(/(aggiungi|speso|pagato|pagata|comprato|comprata|spesa|registra|segna)/.test(t)||!/\b(stipendio|entrata)\b/.test(t))){
    let d=t;if(amt.raw)d=d.replace(amt.raw,' ');else d=d.split(' ').filter(w=>!(w in U)&&!/^(vent|trent|quarant|cinquant|sessant|settant|ottant|novant)/.test(w)&&!/cento$/.test(w)&&w!=='mille').join(' ');
    const words=d.split(' ').filter(w=>w&&!STOP.has(w)),merchant=words.join(' ')||null,cat=guessCat(merchant||'');
    await addExpense({amount:amt.n,merchant,category:cat,spent_on:today(),source:'voce'});

  }
  if(/(aggiungi|registra|segna)/.test(t))return'Dimmi anche l\'importo, per esempio: aggiungi spesa 20 benzina.';

function parseWhen(t){
  const now=new Date(),add=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return ymd(d)};
  let d=null,m;
  if(/dopodomani/.test(t))d=add(2);else if(/\bdomani\b/.test(t))d=add(1);else if(/\boggi\b/.test(t))d=add(0);
  else if((m=t.match(/\b(lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)\b/))){const idx=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'].indexOf(m[1]);let diff=(idx-now.getDay()+7)%7;d=add(diff||7)}
  else if((m=t.match(/\b(?:il|del)\s+(\d{1,2})\b(?:\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre))?/))){const dd=+m[1],mm=m[2]?MESI.indexOf(m[2]):now.getMonth();let y=now.getFullYear(),x=new Date(y,mm,dd);if(x<new Date(y,now.getMonth(),now.getDate()))x=new Date(y,m[2]?mm:mm+1,dd);if(x.getFullYear()!==y&&m[2]&&false)y++;d=ymd(x)}

  return{d,time,raw:[m&&m[0]]};
}
function calCommand(raw){

  if(/\b(cosa|che)\b.*\b(ho|c e|ce)\b|\bagenda\b|\bimpegni\b/.test(t)&&!/\baggiungi\b/.test(t)){
    const w=parseWhen(t),d=w.d||today(),l=(CAL[d]||[]);

  return'Segnato: '+what+', '+dlabel(d)+(w.time?' alle '+w.time:'')+'.';
}

const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-/i;
const newId=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&3|8).toString(16)}));
let calSync=S?'wait':'off',calPulledAt=0;
function paintSync(){const c=$('#calv');if(!c)return;let s=$('#syn');if(!s){s=document.createElement('div');s.id='syn';s.className='syn';c.appendChild(s)}
  s.textContent=!S?'Solo su questo dispositivo. Entra una volta in Finanze per sincronizzare su tutti i dispositivi.':calSync==='ok'?'Sincronizzato':calSync==='err'?'Offline: riprovo più tardi.':'Sincronizzo…'}
async function calFlushDel(){if(!S)return;let q=lget('flat_caldel')||[];const keep=[];for(const id of q){try{await api('events?id=eq.'+id,{method:'DELETE'})}catch{keep.push(id)}}lset('flat_caldel',keep)}
async function calPull(force){
  if(!S){calSync='off';return}
  if(!force&&Date.now()-calPulledAt<20000)return;calPulledAt=Date.now();
  try{
    await calFlushDel();
    const up=[];for(const d in CAL)for(const e of CAL[d])if(!e.s){if(!UUID.test(String(e.id)))e.id=newId();up.push({id:e.id,day:d,time:e.time||'',title:e.t})}
    if(up.length)await api('events',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up)});

    CAL=c;calSave();calSync='ok';
  }catch{calSync='err'}

async function calPush(d,e){if(!S)return;try{await api('events',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:e.id,day:d,time:e.time,title:e.t})});e.s=1;calSave();calSync='ok'}catch{calSync='err'}paintSync()}

    const u='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&minutely_15=precipitation&forecast_minutely_15=16&hourly=precipitation_probability,precipitation&forecast_hours=24&timezone=Europe%2FRome&forecast_days=7&wind_speed_unit=kmh';
    const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();lset('flat_wx',{t:Date.now(),j});return j;
  }catch{if(c)return c.j;throw new Error('meteo')}
}
const SYN=29.530588853,NEWREF=Date.UTC(2000,0,6,18,14);
const moonAge=(t)=>{let a=((t-NEWREF)/864e5)%SYN;if(a<0)a+=SYN;return a};
function moonInfo(t){const a=moonAge(t),p=a/SYN,il=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  const n=a<1.85?'Luna nuova':a<5.54?'Luna crescente (falce)':a<9.23?'Primo quarto':a<12.91?'Gibbosa crescente':a<16.61?'Luna piena':a<20.3?'Gibbosa calante':a<23.99?'Ultimo quarto':a<27.68?'Luna calante (falce)':'Luna nuova';
  const nx=(target)=>{let d=target-a;if(d<=0)d+=SYN;return new Date(t+d*864e5)};
  return{a,p,il,n,full:nx(SYN/2),nw:nx(SYN)}}
function moonSvg(p){const r=44,cx=50,cy=50,k=Math.cos(2*Math.PI*p),rx=(Math.abs(k)*r).toFixed(2),wax=p<.5;

  return'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#2b2f3a"/><path d="M'+cx+' '+(cy-r)+' A'+r+' '+r+' 0 0 '+sl+' '+cx+' '+(cy+r)+' A'+rx+' '+r+' 0 0 '+st+' '+cx+' '+(cy-r)+'Z" fill="#f3ecd0"/></svg>'}
const dday=d=>{const x=new Date(d+'T12:00:00');return d===today()?'Oggi':GIORNI[x.getDay()].slice(0,3)};

const RADAR='https://www.meteoeradar.it/radar-meteo';
const rInt=h=>h<0.5?'pioviggine':h<2.5?'debole':h<7.6?'moderata':'forte';
function nowcast(j){
  const m=j.minutely_15;if(!m||!m.time)return null;
  const now=Date.now(),T=m.time.map(t=>new Date(t).getTime());
  let i0=T.findIndex(t=>t+15*60000>now);if(i0<0)i0=0;
  const v=m.precipitation.slice(i0,i0+8).map(x=>+x||0),mmh=v.map(x=>x*4),wet=x=>x>=0.1;
  let txt;
  if(wet(v[0]*1)||v[0]>=0.025){const end=v.findIndex(x=>!(x>=0.025));
    txt=end<0?'Sta piovendo ('+rInt(mmh[0])+') e continua per almeno 2 ore.':'Sta piovendo ('+rInt(mmh[0])+'), dovrebbe smettere tra circa '+end*15+' minuti.'}
  else{const k=v.findIndex(x=>x>=0.025);
    txt=k<0?'Nessuna pioggia prevista nelle prossime 2 ore.':'Pioggia in arrivo tra circa '+Math.max(5,k*15)+' minuti ('+rInt(mmh[k])+').'}
  return{txt,mmh,i0,T}
}
function hourlyRain(j){
  const h=j.hourly;if(!h||!h.time)return[];const now=Date.now();
  const out=[];h.time.forEach((t,i)=>{const ts=new Date(t).getTime();if(ts+3600000>now&&out.length<12)out.push({h:t.slice(11,13)+':00',p:h.precipitation_probability[i],mm:+h.precipitation[i]||0})});return out}
function rainCard(j){
  const n=nowcast(j);if(!n)return'';
  const mx=Math.max(2,...n.mmh),bars=n.mmh.map((x,k)=>'<div class="rbar"><i style="height:'+Math.max(x>0?6:2,Math.round(x/mx*100))+'%"></i><span>'+(k===0?'ora':k%2===0?'+'+k*15+'′':'')+'</span></div>').join('');
  const hr=hourlyRain(j).map(x=>'<div class="rh"><span>'+x.h+'</span><div class="rp"><i style="height:'+(x.p||0)+'%"></i></div><b>'+(x.p==null?'–':x.p+'%')+'</b><small>'+(x.mm>0?x.mm.toFixed(1)+' mm':'–')+'</small></div>').join('');
  return'<h4 class="wh">Pioggia</h4><div class="rcard"><div class="rtx">'+n.txt+'</div><div class="rbars" aria-label="Pioggia prevista nelle prossime 2 ore, ogni 15 minuti">'+bars+'</div><div class="rsub">Prossime 2 ore, ogni 15 minuti</div>'+
    '<div class="rhs">'+hr+'</div><div class="rsub">Prossime ore: probabilità e quantità di pioggia</div>'+
    '<a class="radar" href="'+RADAR+'" target="_blank" rel="noopener">Apri il radar di Meteo&amp;Radar</a>'+
    '<div class="rsub">Le previsioni a 15 minuti sono calcolate da modelli, non dal radar: per vedere dove sta piovendo davvero guarda il radar.</div></div>'}
function paintMeteo(j){
  const c=j.current,d=j.daily,w=wc(c.weather_code);

async function weatherCommand(raw){
  const t=norm(raw);
  if(/\bluna\b|lunare/.test(t)){const m=moonInfo(Date.now());return'Oggi la luna è: '+m.n.toLowerCase()+', illuminata al '+m.il+' per cento. La prossima luna piena è il '+dfull(m.full)+'.'}
  let j;try{j=await fetchMeteo()}catch{return'Non riesco a leggere il meteo adesso.'}
  const d=j.daily;let i=0,quando='Oggi';
  if(/dopodomani/.test(t)){i=2;quando='Dopodomani'}else if(/\bdomani\b/.test(t)){i=1;quando='Domani'}
  if(i===0&&/\b(adesso|ora|fuori|in questo momento)\b/.test(t)){const c=j.current;return'Adesso a '+PLACE+' ci sono '+Math.round(c.temperature_2m)+' gradi, '+wc(c.weather_code)[0].toLowerCase()+', percepiti '+Math.round(c.apparent_temperature)+'.'}
  const pp=d.precipitation_probability_max[i],x=wc(d.weather_code[i])[0].toLowerCase();
  if(i===0&&/piove|piover|pioggia|ombrello|nuvol|acquazzone/.test(t)&&/\b(adesso|ora|fuori|tra poco|stasera|a breve|presto|prossime ore|ore)\b|^piove\b|\bsta piovendo\b/.test(t)){const n=nowcast(j);if(n)return n.txt+' Probabilità di pioggia oggi: '+d.precipitation_probability_max[0]+' per cento.'}
  if(/piove|piover|pioggia|ombrello/.test(t))return quando+' la probabilità di pioggia è del '+pp+' per cento ('+x+').';
  return quando+' a '+PLACE+': '+x+', tra '+Math.round(d.temperature_2m_min[i])+' e '+Math.round(d.temperature_2m_max[i])+' gradi, pioggia al '+pp+' per cento.'
}

let REM=[],remAt=0;
function fixedDue(){
  const m={};for(const x of D.exp)if(x.is_fixed){const k=String(x.merchant||x.category||'').toLowerCase();if(!m[k]||x.spent_on>m[k].spent_on)m[k]=x}
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),out=[];
  for(const k in m){const x=m[k],last=new Date(x.spent_on+'T12:00:00'),dom=last.getDate();
    const mk=(yy,mm)=>new Date(yy,mm,Math.min(dom,new Date(yy,mm+1,0).getDate()));
    let due=mk(now.getFullYear(),now.getMonth());if(last>=new Date(now.getFullYear(),now.getMonth(),1))due=mk(now.getFullYear(),now.getMonth()+1);
    const days=Math.round((due-t0)/864e5);
    if(days<=7&&days>=-5)out.push({kind:'spesa',days,t:x.merchant||x.category,amt:x.amount})}
  return out}
function buildRem(){
  const out=[],t0=new Date(today()+'T12:00:00');
  for(let i=0;i<=7;i++){const d=new Date(t0);d.setDate(d.getDate()+i);for(const e of CAL[ymd(d)]||[])out.push({kind:'ev',days:i,t:e.t,time:e.time})}
  for(const x of TK)if(x.st!=='done'&&x.due){const dd=Math.round((new Date(x.due+'T12:00:00')-t0)/864e5);if(dd<=7&&dd>=-3)out.push({kind:'task',days:dd,t:x.t})}
  try{out.push(...fixedDue())}catch{}
  out.sort((a,b)=>a.days-b.days||String(a.time||'99').localeCompare(String(b.time||'99')));return out}
const remWhen=(r)=>r.days===0?'Oggi':r.days===1?'Domani':r.days<0?'In ritardo':'Tra '+r.days+' giorni';
function paintRem(){
  REM=buildRem();const near=REM.filter(r=>r.days<=1),st=$('#rstrip'),bd=$('#rbadge');
  if(bd){bd.textContent=near.length;bd.hidden=!near.length}
  if(st){if(near.length){st.hidden=false;st.textContent=near.slice(0,2).map(r=>remWhen(r)+': '+r.t+(r.time?' '+r.time:'')).join(' · ')+(near.length>2?' · +'+(near.length-2):'')}else st.hidden=true}
}
async function refreshRem(){
  paintRem();if(!S)return;
  try{await calPull();await tkPull();
    if(Date.now()-remAt>5*60000){const st=await rpc('pin_status');if(st==='verified'){await loadAll();remAt=Date.now()}}}catch{}
  paintRem();
}
function openRem(){
  paintRem();
  const h=REM.length?REM.map(r=>'<div class="ev"><span class="tm" style="min-width:86px">'+remWhen(r)+'</span><span class="tx">'+esc(r.t)+(r.time?' · '+esc(r.time):'')+(r.kind==='task'?' <small style="color:var(--dim)">(task)</small>':'')+(r.kind==='spesa'?' <small style="color:var(--dim)">(spesa fissa'+(r.days<0?', registrata?':'')+(r.amt?' · '+eur(r.amt):'')+')</small>':'')+'</span></div>').join(''):'<div class="empty">Niente in scadenza nei prossimi 7 giorni.</div>';

}

async function musicCommand(raw){
  const t=norm(raw);
  if(!SP){PEND={kind:'music',apply:null};return'Per la musica devo prima collegare Spotify: ti apro Musica, tocca Collega Spotify.'}
  const done=(msg,hl)=>{PEND={kind:'music',noOpen:true,hl:hl||'[data-hl="now"]',apply:()=>{setTimeout(spRefresh,600)}};return msg};
  try{
    if(/\b(che|quale) (canzone|brano|musica)|cosa sta suonando|cosa sento|chi canta|cosa sto ascoltando/.test(t)){await spRefresh();const n=spTitle();return done(n?'Stai ascoltando '+n.t+(n.a?', di '+n.a:'')+'.':'Non sta suonando niente.')}
    if(/\b(pausa|ferma|fermati|stop|stoppa)\b/.test(t)){await spDo(()=>spApi('/me/player/pause','PUT'));return done('Messa in pausa.')}
    if(/\b(prossim\w*|salta|avanti|skip)\b/.test(t)||/\bcambia\b/.test(t)&&/\b(canzone|brano|musica|traccia)\b/.test(t)&&!/\b(con|in|su)\s+\w/.test(t.replace(/\b(canzone|brano|musica|traccia)\b/,''))){await spDo(()=>spApi('/me/player/next','POST'));return done('Passo al prossimo brano.')}
    if(/\b(preceden\w*|indietro)\b/.test(t)){await spDo(()=>spApi('/me/player/previous','POST'));return done('Torno al brano precedente.')}
    if(/\b(shuffle|casuale|mescola)\b/.test(t)){const off=/\b(togli|disattiva|spegni|senza|non)\b/.test(t);await spDo(()=>spApi('/me/player/shuffle?state='+!off,'PUT'));return done(off?'Riproduzione casuale spenta.':'Riproduzione casuale attiva.')}
    if(/\bvolume\b|\balza\b|\babbassa\b|piu forte|piu piano/.test(t)){
      let v=(t.match(/\d+/)||[])[0];await spRefresh();const c=(spNow&&spNow.device&&spNow.device.volume_percent)||50;
      v=v!=null?+v:(/alza|piu forte|aumenta/.test(t)?c+15:c-15);v=Math.max(0,Math.min(100,v));
      await spDo(()=>spApi('/me/player/volume?volume_percent='+v,'PUT'));return done('Volume al '+v+' per cento.')}
    let m=t.match(/\b(?:metti|mettimi|mettere|riproduci|suona|suonami|suonare|fai partire|far partire|fammi sentire|ascolta|ascoltare|voglio sentire|voglio ascoltare|cambia (?:con|in|su)|passa a|cerca)\s+(.*)$/);
    let q=m?m[1]:'';const hintPl=/\bplaylist\b/.test(t),hintTr=/\b(canzone|brano)\b/.test(t);
    q=q.replace(/\b(su|con|da) spotify\b/g,'').replace(/\b(la|il|lo|l|una|un|di|del|della|dei|alcune|un po di)\s+/g,' ').replace(/\b(playlist|canzone|brano|album|musica|spotify)\b/g,' ').replace(/\s+/g,' ').trim();
    if(!m||!q){await spDo(()=>spApi('/me/player/play','PUT'));return done('Riprendo la musica.')}
    if(/\b(brani piaciuti|preferiti|mi piace|piace)\b/.test(t)){const j=await spApi('/me/tracks?limit=50');const us=(j.items||[]).map(x=>x.track&&x.track.uri).filter(Boolean);if(!us.length)return'Non hai brani piaciuti.';await spPlay({uris:us});return done('Parte la tua musica preferita.')}
    if(!spPl)await spLoadPl();
    const words=q.split(' ').filter(w=>w.length>1);
    if(!hintTr&&spPl){const best=spPl.map(p=>{const n=norm(p.name);return[words.filter(w=>n.includes(w)).length/(words.length||1),p]}).sort((a,b)=>b[0]-a[0])[0];
      if(best&&best[0]>=.99){await spPlay({context_uri:best[1].uri});return done('Parte la playlist '+best[1].name+'.')}}
    const R=await spSearch(q,hintPl?'playlist':hintTr?'track':'track,playlist,artist');
    if(hintPl&&R.playlists[0]){await spPlay({context_uri:R.playlists[0].uri});return done('Parte la playlist '+R.playlists[0].name+'.')}
    const ar=R.artists.find(a=>{const n=norm(a.name);return words.length&&words.every(w=>n.includes(w))});
    if(ar&&!hintTr){await spPlay({context_uri:ar.uri});return done('Parte '+ar.name+'.')}
    if(R.tracks[0]){const x=R.tracks[0];await spPlay({uris:[x.uri]});return done('Parte '+x.name+', di '+x.artists.map(a=>a.name).join(', ')+'.')}
    if(R.playlists[0]){await spPlay({context_uri:R.playlists[0].uri});return done('Parte la playlist '+R.playlists[0].name+'.')}
    return'Non trovo "'+q+'" su Spotify.'
  }catch(e){if(e.message==='nologin')PEND={kind:'music',apply:null};return spErr(e)}
}

const DELV=/\b(elimina|eliminare|elimini|eliminami|rimuovi|rimuovere|rimuovimi|cancella|cancellare|cancellami|togli|togliere|annulla|annullare|butta)\b/;
const STOPD=new Set('elimina eliminare elimini eliminami rimuovi rimuovere rimuovimi cancella cancellare cancellami togli togliere annulla annullare butta il lo la le gli l un una uno dal dalla dallo del della dello di dei delle evento eventi appuntamento appuntamenti calendario agenda task taks compito compiti spesa spese quaderno per da a in nel sul sulla con che mio mia questo questa oggi domani dopodomani lunedi martedi mercoledi giovedi venerdi sabato domenica alle ultima ultimo euro'.split(' '));

let PEND=null;
function commit(kind,hl,fn){PEND={kind,hl,apply:fn}}

const APPS=[['cal',/\b(calendario|agenda)\b/,'il calendario'],['meteo',/\b(meteo|luna|radar)\b/,'il meteo'],['ash',/\b(ash|scheda)\b/,'la scheda di Ash'],['task',/\b(quaderno|quadernino|task|taks|compiti)\b/,'il quaderno'],['fin',/\bfinanze\b/,'Finanze'],['music',/\b(musica|spotify)\b/,'la musica']];
function openCmd(t){
  if(!/\b(apri|aprimi|vai|mostra|mostrami|portami|fammi vedere)\b/.test(t))return null;
  if(/\b(aggiungi|metti|segna|crea|inserisci)\b/.test(t))return null;
  for(const[k,re,nm]of APPS)if(re.test(t)){PEND={kind:k};return'Apro '+nm+'.'}
  return null}
/* ---------- trovare cosa eliminare / spostare ---------- */
function pickTarget(t,kind,useDate){
  const w=useDate?parseWhen(t):{d:null},q=t.split(' ').filter(x=>x.length>2&&!STOPD.has(x)&&!/^\d/.test(x));
  const sc=title=>{const n=norm(title);return q.filter(x=>n.includes(x)).length};
  let evs=[],tks=[];
  if(kind!=='task'){for(const d in CAL)for(const e of CAL[d]){if(w.d&&d!==w.d)continue;evs.push({d,e,s:q.length?sc(e.t):(w.d?1:0)})}}
  if(kind!=='ev'&&!(w.d&&!q.length)){for(const x of TK)tks.push({x,s:q.length?sc(x.t):0})}
  const all=[...evs.filter(o=>o.s>0).map(o=>({k:'ev',s:o.s,o})),...tks.filter(o=>o.s>0).map(o=>({k:'task',s:o.s,o}))].sort((a,b)=>b.s-a.s);
  if(!all.length){
    if(!q.length&&!w.d)return{err:'Dimmi il nome, per esempio: evento dentista, oppure task bolletta.'};
    return{err:'Non trovo '+(kind==='ev'?'nessun evento':kind==='task'?'nessuna task':'niente')+(q.length?' che somigli a "'+q.join(' ')+'"':'')+(w.d?' per '+dlabel(w.d):'')+'. Non ho cambiato nulla.'}}
  const top=all.filter(a=>a.s===all[0].s);
  if(top.length>1){const nm=a=>a.k==='ev'?a.o.e.t+' ('+dlabel(a.o.d)+')':a.o.x.t;return{err:'Ne trovo più di una: '+top.slice(0,4).map(nm).join('; ')+'. Dimmi quale, con più dettagli.'}}
  return top[0]}
async function delCommand(raw){
  const t=norm(raw).replace(/^(ehi|hey|ciao|oh)?\s*(fla ?tech|fla)\b[ ,]*/,'');
  const kind=/\b(task|taks|compito|compiti|quaderno)\b/.test(t)?'task':/\b(evento|eventi|appuntamento|appuntamenti|calendario|agenda)\b/.test(t)?'ev':/\b(spesa|spese|euro)\b/.test(t)?'exp':'';
  if(kind==='exp'||(kind===''&&/\bultim/.test(t)))return null;
  const a=pickTarget(t,kind,true);if(a.err)return a.err.replace('Dimmi il nome','Cosa vuoi eliminare? Dimmi il nome');

    commit('cal','',()=>{CAL[d]=(CAL[d]||[]).filter(y=>y.id!==e.id);if(!CAL[d].length)delete CAL[d];calSave();calDel(e.id);calSel=d;const dt=new Date(d+'T12:00:00');calY=dt.getFullYear();calM=dt.getMonth();if($('#calv'))showCal();paintRem()});

  commit('task','',()=>{tkRemove(a.o.x.id);if($('#tkb'))paintTk();paintRem()});
  return'Eliminata la task: '+a.o.x.t+'.'}
function lastWhen(t){const seg=t.split(/\s(?:a|al|per|su|verso)\s(?=(?:oggi|domani|dopodomani|lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica|il\s+\d|alle|\d))/);return seg.length>1?seg[seg.length-1]:t}
async function moveCommand(raw){

  const tail=lastWhen(t),w=parseWhen(tail);if(!w.d&&!w.time)return'Dimmi anche quando, per esempio: sposta evento dentista a venerdì alle 17.';

  if(/\bash\b|scheda|\bca\b|classe armatura|competenz|inventario|risors|dad[io] vita|ispirazione|salvezza contro la morte|sottoclasse|punti ferita|\bpf\b|focus|riposo (lungo|breve)|iniziativa|\b(tira|lancia)\b|\bdanni?\b|ferito|\bmi curo\b/.test(t)&&!/\b(task|taks|compito|compiti|quaderno|evento|appuntamento|calendario)\b/.test(t)&&!/\b(spes\w*|euro|speso|stipendio)\b/.test(t))return await ashCommand(raw);
  if(DELV.test(t)){const r=await delCommand(raw);if(r!==null)return r}
  if(/\b(sposta|spostare|spostami|rimanda|rinvia|posticipa|anticipa)\b/.test(t))return await moveCommand(raw);
  if(/\b(task|taks|compito|compiti|quaderno|quadernino|to ?do)\b/.test(t))return await taskCommand(raw);
  if(/calendario|evento|appuntament|agenda|impegn|ricordami|\bcosa ho\b/.test(t))return calCommand(raw);
  if(/promemoria|scadenz|cosa devo fare|cosa ho da fare/.test(t))return remVoice();
  if(/\b(meteo|tempo|piove|piover[aà]?|pioggia|ombrello|temperatura|luna|lunare|nuvol\w*|sole|freddo|caldo|gradi|neve|vento)\b/.test(t)&&!/\b(spes\w*|euro|pagat\w*|speso)\b/.test(t))return await weatherCommand(raw);
  if(!S)return'Per inserire le finanze devi prima entrare una volta in Finanze con email, password e PIN.';
  let st;try{st=await rpc('pin_status')}catch{return'Sessione scaduta: apri Finanze e rientra.'}
  if(st!=='verified')return'Apri Finanze e inserisci il PIN, poi potrò scrivere le spese da qui.';
  if(!D.exp.length&&!D.inc.length)await loadAll();
  if(/\b(apri|vai|mostra|portami)\b/.test(t)&&/finanz|spese|spesa|fisse|cicli|home|principale|stipendi/.test(t)){
    const m={spese:'spese',spesa:'spese',fisse:'fisse',cicli:'cicli',stipendi:'cicli'};let tb='home';for(const w of t.split(' '))if(m[w]){tb=m[w];break}
    closeSheet();tab=tb;openApp($('#sq-finanze'),'fin');return'Apro Finanze.';
  }
  const out=await command(raw);
  if(/^(Aggiunta spesa|Stipendio registrato|Entrata registrata|Tolta)/.test(out))PEND={kind:'fin',apply:()=>setTab('spese')};
  return out;
}

  <button class="mic" id="micbtn" data-act="voice" aria-label="Voce"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

}

  else if(a==='del'){if(!confirm('Eliminare questa spesa?'))return;try{await api('expenses?id=eq.'+id,{method:'DELETE'});openRow=null;await loadAll();render();toast('Spesa eliminata')}catch(er){toast(er.message)}}

/* ---------- presenza: il sistema ti guarda e ti aiuta ---------- */
let aiT=null,aiH=null,gzT=null;
function aiSet(st){const h=$('#hub');if(h&&h.dataset.ai!==st)h.dataset.ai=st}
function aiCap(txt,hold){
  const c=$('#aicap');if(!c)return;clearInterval(aiT);clearTimeout(aiH);
  if(!txt){c.classList.remove('on');return}
  c.textContent='';c.classList.add('on');let i=0;
  aiT=setInterval(()=>{c.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(aiT);aiH=setTimeout(()=>c.classList.remove('on'),hold||7000)}},26)}
function aiGreet(){
  const h=new Date().getHours(),g=h<5?'Ciao Flavio':h<12?'Buongiorno Flavio':h<18?'Buon pomeriggio Flavio':'Buonasera Flavio';
  paintRem();const near=REM.filter(r=>r.days<=1);let l2='';
  if(near.length)l2=(near[0].days===0?'Oggi':'Domani')+' hai: '+near.slice(0,2).map(r=>r.t).join(' e ')+(near.length>2?' e altro.':'.');
  else{try{const c=lget('flat_wx');const n=c&&Date.now()-c.t<30*60000&&nowcast(c.j);if(n&&/Sta piovendo|in arrivo/.test(n.txt))l2=n.txt}catch{}}
  return g+'.'+(l2?' '+l2:' Tutto tranquillo.')}
function aiWake(){aiSet('wake');setTimeout(()=>{if($('#hub').dataset.ai==='wake')aiSet('idle')},2600);aiCap(aiGreet())}
addEventListener('pointermove',e=>{
  const h=$('#hub');if(!h||appOpen)return;const t=$('.tri').getBoundingClientRect(),dx=e.clientX-(t.left+t.width/2),dy=e.clientY-(t.top+t.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/260);
  h.style.setProperty('--gx',(dx/d*4*k).toFixed(2));h.style.setProperty('--gy',(dy/d*4*k).toFixed(2));
  clearTimeout(gzT);gzT=setTimeout(()=>{h.style.setProperty('--gx',0);h.style.setProperty('--gy',0)},3500)},{passive:true});
/* ragnatela: fili sottilissimi tra triangolo e forme, seguono il movimento ma non girano */
(function(){
  const svg=$('#web'),NS='http://www.w3.org/2000/svg',ids=['sq-finanze','ov-meteo','ci-ash','re-cal','qd-task','mu-music'];
  const mk=(t,c)=>{const e=document.createElementNS(NS,t);if(c)e.setAttribute('class',c);svg.appendChild(e);return e};
  const rings=ids.map(()=>mk('circle')),spokes=ids.map(()=>mk('line')),links=ids.map(()=>mk('line','nb'));
  function tick(){
    const hub=$('#hub');
    if(!hub.classList.contains('open')||appOpen||document.hidden){setTimeout(tick,400);return}
    const t=$('.tri').getBoundingClientRect(),cx=t.left+t.width/2,cy=t.top+t.height/2;
    const P=ids.map(id=>{const r=$('#'+id).getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]});
    let last=-99;P.map((p,i)=>[Math.hypot(p[0]-cx,p[1]-cy),i]).sort((a,b)=>a[0]-b[0]).forEach(([d,i])=>{const ok=d-last>22;if(ok)last=d;rings[i].style.display=ok?'':'none';rings[i].setAttribute('cx',cx);rings[i].setAttribute('cy',cy);rings[i].setAttribute('r',d)});
    P.forEach((p,i)=>{spokes[i].setAttribute('x1',cx);spokes[i].setAttribute('y1',cy);spokes[i].setAttribute('x2',p[0]);spokes[i].setAttribute('y2',p[1])});
    const ord=P.map((p,i)=>[Math.atan2(p[1]-cy,p[0]-cx),i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    ord.forEach((i,k)=>{const a=P[i],b=P[ord[(k+1)%ord.length]],l=links[k];l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1])});
    requestAnimationFrame(tick);
  }
  tick();
})();
})();
