<style>

/* ---------- HUB ---------- */
#hub{position:fixed;inset:0;background:var(--bg);overflow:hidden;transition:background .4s}
.tbtn{position:absolute;top:calc(var(--sat) + 14px);right:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:grid;place-items:center;cursor:pointer;z-index:3}
.tbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wkind{position:fixed;top:calc(var(--sat) + 4px);left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:6px;font:700 11px var(--sans);color:var(--dim);pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}.wkind i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:wpulse 1.6s ease-in-out infinite}body.wk.inapp .wkind{display:flex}
.wbtn{right:70px}.wdot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--green);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.wbtn.on{background:color-mix(in srgb,var(--green) 25%,var(--panel));border-color:var(--green)}.wbtn.on .wdot{transform:scale(1);animation:wpulse 1.6s ease-in-out infinite}@keyframes wpulse{50%{opacity:.35}}
.tbtn .moon{display:none}
html[data-theme=dark] .tbtn .sun{display:none}
html[data-theme=dark] .tbtn .moon{display:block}
.tri{position:absolute;left:50%;top:50%;width:min(80vw,420px,58dvh);aspect-ratio:1;transform:translate(-50%,-50%);transition:transform .95s cubic-bezier(.65,0,.2,1);border:0;background:none;padding:0;cursor:pointer;z-index:2;outline:none}
.tri svg{width:100%;height:100%;overflow:visible;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 16px 26px rgba(70,130,170,.28))}
.tri:active{filter:brightness(.97)}
#hub.open .tri{transform:translate(-50%,calc(-50% - 3dvh)) scale(.5)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1.8deg)}}
.hintx{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);left:0;right:0;text-align:center;color:var(--dim);font-size:14px;letter-spacing:.02em;transition:opacity .4s}

.parla{white-space:nowrap;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);display:flex;align-items:center;gap:10px;padding:16px 26px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:700 17px var(--sans);box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,transform .6s cubic-bezier(.34,1.56,.64,1)}
.vtag{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);font-size:10px;letter-spacing:.04em;color:var(--dim);opacity:.4;pointer-events:none;white-space:nowrap}
.parla svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#hub.open .parla{opacity:1;pointer-events:auto;transform:translate(-50%,0);transition-delay:.9s}
.shapes{position:absolute;inset:0;pointer-events:none;--ux:min(1vw,7px);--uy:min(1dvh,9px)}
.shape{--s:clamp(100px,28vw,140px);position:absolute;left:50%;top:calc(50% - 3dvh);width:var(--s);height:var(--s);border:0;cursor:pointer;opacity:0;transform:translate(-50%,-50%) scale(.15);
transition:transform .85s cubic-bezier(.34,1.45,.64,1),opacity .4s;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.01em;outline:none;z-index:1}
#hub.open .shape{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--x)*var(--ux)),calc(var(--y)*var(--uy)));pointer-events:auto;transition-delay:calc(.35s + var(--i)*.1s);animation:bob 6s ease-in-out calc(1.6s + var(--i)*.7s) infinite}

.dsr{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.dst{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}.dst b{min-width:56px;text-align:center}
.dst button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:20px;font-weight:700;cursor:pointer}
.dgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dd2{padding:14px 0;border-radius:14px;border:0;background:var(--beige);color:var(--beige-d);font-size:16px;font-weight:800;cursor:pointer}.dd2:active{transform:scale(.95)}
.dh{margin-top:10px;display:flex;flex-direction:column;gap:4px}.dhe{font-size:13px;color:var(--dim);text-align:center;padding:6px 0}
.dhr{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--bg)}.dhr b{min-width:64px}.dhr span{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dhr i{font-style:normal;font-weight:800;font-size:16px}
/* ---------- barra info + menu a discesa ---------- */
:root{--sat:env(safe-area-inset-top,0px)}
.ibar{position:absolute;top:calc(var(--sat) + 10px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3;cursor:pointer}
.ibar::after{content:'';position:absolute;left:50%;bottom:-9px;width:34px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.tmd{font:800 56px/1.1 var(--sans);text-align:center;margin:14px 0;font-variant-numeric:tabular-nums;letter-spacing:1px}.tmdone{text-align:center;font-weight:800;color:#d6402f;font-size:18px}
.tmchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tmcust{display:flex;gap:8px;margin:12px 0}.tmcust input{flex:1}.tmbtns{display:flex;gap:10px;margin-top:6px}.tmbtns .btn{flex:1}
.ipill#ip-t{cursor:pointer}.ipill{height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;white-space:nowrap}
.ipill[hidden]{display:none}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.low{color:#e5484d}.ib.chg{color:#2f9d62}
#dsbar{display:none;flex:1 1 100%;width:100%}.drop.ds-on .ddi{display:none}.drop.ds-on #dsbar{display:block}
#dsin{width:100%;box-sizing:border-box;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:0 18px;font:600 16px var(--sans);outline:none}
#dsres{max-height:46dvh;overflow:auto;margin-top:10px;text-align:left}.srh{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:12px 4px 4px}
.srr{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--tx)}.srr i{font-style:normal;color:var(--dim);font-size:12px}.srr.dim{color:var(--dim)}
.ddscrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s}
#hub.dd-open .ddscrim{opacity:1;pointer-events:auto}
.drop{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-around;gap:8px;padding:calc(var(--sat) + 14px) 14px 26px;background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-radius:0 0 28px 28px;box-shadow:0 18px 40px rgba(0,0,0,.2);transform:translateY(-108%);visibility:hidden;transition:transform .35s cubic-bezier(.3,.9,.3,1),visibility 0s .35s}
#hub.dd-open .drop{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.3,.9,.3,1),visibility 0s}
.tbtn.tcbtn.on{background:#ffd34a;border-color:#e7a93a;color:#4a3c06;box-shadow:0 0 14px rgba(255,211,74,.7)}
.ddi{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--dim)}
.drop .tbtn{position:relative;top:auto;right:auto;left:auto;width:52px;height:52px}
.grab{position:absolute;left:50%;bottom:9px;width:44px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%);cursor:pointer}
#up-app.spin svg{animation:gspin .8s linear infinite}
html[data-style=reattore] .ipill{background:hsl(calc(var(--rh) + 7) calc(64% * var(--rs)) 11.0% / .8);border-color:hsl(var(--rh) calc(87% * var(--rs)) 69.6% / .45);color:hsl(calc(var(--rh) + -1) calc(100% * var(--rs)) 78.0%)}
html[data-style=reattore] .ib.low{color:#ff7a7f}html[data-style=reattore] .ib.chg{color:#5BE3A8}

html[data-style=reattore] .ddi{color:hsl(calc(var(--rh) + 5) calc(25% * var(--rs)) 70.0%)}html[data-style=reattore] .grab,html[data-style=reattore] .ibar::after{background:hsl(var(--rh) calc(87% * var(--rs)) 69.6% / .4)}
/* ---------- STILI HOME (Cambia stile) ---------- */
.bgraph{margin:12px 0 4px;background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}.bgraph svg{width:100%;height:auto;display:block}
.bcap{text-align:center;font-size:12px;font-weight:700;color:var(--dim);padding:0 0 10px}
.bgraph .bl{stroke-width:1.5;opacity:.75;stroke-dasharray:1;stroke-dashoffset:1;animation:bdraw .9s ease forwards;fill:none}
@keyframes bdraw{to{stroke-dashoffset:0}}
.bgraph .bn{animation:bpop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.bgraph .bt{animation:bbeat 3.2s ease-in-out infinite}
@keyframes bbeat{50%{transform:scale(1.1)}}
.bgraph text{font-family:var(--sans);font-weight:700}
.brain{position:absolute;left:calc(50% + 108px);bottom:calc(env(safe-area-inset-bottom) + 32px);width:46px;height:46px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;z-index:3;box-shadow:var(--shadow)}
.brain svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hub.open .brain{opacity:1;pointer-events:auto;transition-delay:.9s}
.brain.dot::after{content:'';position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#e5484d;border:2px solid var(--panel)}
html[data-style=reattore] .brain{background:hsl(calc(var(--rh) + 7) calc(64% * var(--rs)) 11.0% / .85);border-color:hsl(var(--rh) calc(87% * var(--rs)) 69.6% / .6);color:hsl(calc(var(--rh) + -1) calc(100% * var(--rs)) 78.0%);box-shadow:0 0 14px hsl(calc(var(--rh) + -3) calc(89% * var(--rs)) 65.7% / .25)}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}.bchips .chipb{font-size:13px;padding:9px 12px}
.brow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14px}.brow span{flex:1;min-width:0}.brow b{font-weight:700}.brow small{color:var(--dim)}.brow button{border:0;background:transparent;color:var(--dim);font-size:20px;cursor:pointer;padding:2px 8px}

/* ---------- hub e apertura app ---------- */

  if(kind==='cal')showCal();else if(kind==='meteo')showMeteo();else if(kind==='ash')showAsh();else if(kind==='task')showTasks();else if(kind==='music')showMusic();else if(kind==='apps')showApps();else if(!S)showLogin();else afterLogin();
}

}

/* ---------- auth & api ---------- */
function saveSession(j){S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};lset('flat_s',S)}
async function authPost(path,body,tok){
  const h={apikey:KEY,'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
  let j={};try{j=await r.json()}catch{}return{ok:r.ok,status:r.status,j};
}
async function refresh(){if(!S||!S.refresh_token)return false;try{const r=await authPost('token?grant_type=refresh_token',{refresh_token:S.refresh_token});if(r.ok){saveSession(r.j);return true}}catch{}return false}
function dropSession(){S=null;ldel('flat_s')}
async function api(path,opt={},retry=true){
  if(!S)throw new Error('auth');
  if(S.expires_at-60<Date.now()/1000){if(!(await refresh())){dropSession();throw new Error('auth')}}
  const h=Object.assign({apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(SB+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&retry){if(await refresh())return api(path,opt,false);dropSession();throw new Error('auth')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}
  if(!r.ok)throw new Error((j&&j.message)||('Errore '+r.status));
  return j;
}
const rpc=(n,b)=>api('rpc/'+n,{method:'POST',body:JSON.stringify(b||{})});

/* ---------- schermate di accesso ---------- */
const backBtn='<button class="back" data-act="back" aria-label="Torna a FLA-Tech">'+TRI+'</button>';

  <form id="lf" autocomplete="on"><label>Email<input name="email" type="email" autocomplete="username" required value="${esc(lget('flat_email')||'')}"></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="le">${esc(msg||'')}</div><button class="btn pri" type="submit">Continua</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),em=String(f.get('email')).trim();$('#le').textContent='';
    try{const r=await authPost('token?grant_type=password',{email:em,password:String(f.get('password'))});
      if(!r.ok){$('#le').textContent=r.status===400?'Email o password errate.':'Accesso non riuscito ('+r.status+').';return}
      saveSession(r.j);lset('flat_email',em);await afterLogin();
    }catch{$('#le').textContent='Nessuna connessione.'}};
}
async function afterLogin(){
  try{const st=await rpc('pin_status');
    if(st==='verified')return startApp();
    if(st==='not_set')return showPinSet();
    if(st==='required')return showPinAsk();
    showLogin();
  }catch(e){showLogin(e.message==='auth'?'':'Errore: '+e.message)}
}
function showPinSet(){
  $('#root').innerHTML=`<div class="auth">${backBtn}<h1>Crea il PIN</h1><p>Secondo livello di accesso: scegli un PIN numerico di 4-8 cifre. Lo controlla il database, non solo questa pagina.</p>
  <form id="pf"><label>PIN<input name="a" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required></label>
  <label>Ripeti il PIN<input name="b" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required></label>
  <div class="err" id="pe"></div><button class="btn pri" type="submit">Salva PIN</button></form></div>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),a=String(f.get('a')),b=String(f.get('b'));

async function loadAll(){

function cycles(){
  const st=[...new Set(D.inc.filter(i=>i.source==='stipendio').map(i=>i.received_on))].sort();
  return st.map((s,k)=>{const e=st[k+1]||null,inR=d=>d>=s&&(!e||d<e);
    const inc=D.inc.filter(i=>inR(i.received_on)),exp=D.exp.filter(x=>inR(x.spent_on));
    const income=sum(inc),spent=sum(exp);return{start:s,end:e,income,spent,left:income-spent,exp,inc,current:!e}});
}
const curCycle=()=>{const c=cycles();return c[c.length-1]||null};
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function fixedInfo(){
  const cs=cycles(),map=new Map();
  cs.forEach((c,ci)=>c.exp.forEach(x=>{const k=(x.merchant||x.category||'').trim().toLowerCase();if(!k)return;
    if(!map.has(k))map.set(k,{label:x.merchant||x.category,per:new Map(),flag:false,last:x});
    const m=map.get(k);m.per.set(ci,(m.per.get(ci)||0)+x.amount);if(x.is_fixed)m.flag=true;if(x.spent_on>=m.last.spent_on)m.last=x}));
  return[...map.values()].map(m=>{const v=[...m.per.values()];return{label:m.label,cycles:v.length,avg:v.reduce((a,b)=>a+b,0)/v.length,flag:m.flag,last:m.last}})
    .filter(m=>m.cycles>=2||m.flag).sort((a,b)=>b.avg-a.avg);
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,tw=null;
const MALE=/\b(luca|cosimo|diego|giorgio|paolo|marco|male|uomo|lorenzo|gianni|stefano|google italiano)\b/i,FEM=/\b(elsa|isabella|alice|federica|elisa|female|donna|francesca|silvia|chiara|paola)\b/i;
let vCache=[];
function itVoices(){try{for(const x of speechSynthesis.getVoices())if(/^it/i.test(x.lang)&&!vCache.some(c=>c.name===x.name))vCache.push(x)}catch{}return vCache}
function pickVoice(){const v=itVoices();if(!v.length)return null;const sv=lget('flat_vname');if(sv){const f=v.find(x=>x.name===sv);if(f)return f}
  const sc=x=>(/natural|neural|online/i.test(x.name)?4:0)+(/(diego|cosimo|luca|giorgio)/i.test(x.name)?5:0)+(MALE.test(x.name)&&!FEM.test(x.name)?3:0)-(FEM.test(x.name)?6:0)+(x.localService?1:0);
  return v.slice().sort((a,b)=>sc(b)-sc(a))[0]}
let spTok=0,badV=new Set();
function speak(t,fb){const tok=++spTok;aiSet('speak');if(!voiceOn||!('speechSynthesis' in window)){setTimeout(()=>{if(tok===spTok)aiSet('idle')},Math.min(6000,1400+t.length*40));return}
  try{speechSynthesis.cancel();const parts=(t.replace(/\s+/g,' ').match(/[^.!?;:]+[.!?;:]*/g)||[t]).map(x=>x.trim()).filter(Boolean);let v=fb?null:pickVoice();if(v&&badV.has(v.name))v=itVoices().find(x=>!badV.has(x.name))||null;
    setTimeout(()=>{if(tok!==spTok)return;let started=false,failed=false;
      const retry=()=>{if(failed||tok!==spTok)return;failed=true;if(v)badV.add(v.name);speechSynthesis.cancel();if(!fb)speak(t,true);else aiSet('idle')};
      parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang='it-IT';if(v)u.voice=v;u.rate=.98;u.pitch=.9;u.volume=1;u.onstart=()=>{started=true};
        u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;if(!started)retry();else if(tok===spTok)aiSet('idle')};

let cgF='f',cgT='cre';
function cgCard(o){const T=CGF[cgF];const art=o.art||'';

function cgRays(c){let d='';for(let i=0;i<14;i++){const a=i*Math.PI/7,b=a+Math.PI/14;d+='<path d="M50 52L'+(50+90*Math.cos(a)).toFixed(1)+' '+(52+90*Math.sin(a)).toFixed(1)+'L'+(50+90*Math.cos(b)).toFixed(1)+' '+(52+90*Math.sin(b)).toFixed(1)+'Z"/>'}return'<g fill="'+c+'" opacity=".38">'+d+'</g>'}
function cgItems(){const f=cgF==='f',L=[];

  if(cgT==='luo')CGL.forEach((c,k)=>L.push({i:'l'+k,n:f?c[1]:c[2],role:c[5],cp:c[3],mana:c[4],fx:c[6],leg:c[5]==='Leggendario',art:'<g transform="translate(0 2)">'+CGI[c[0]]+'</g>'}));
  if(cgT==='inc')CGS.forEach((c,k)=>L.push({i:'s'+k,n:f?c[1]:c[2],role:c[5],cp:c[3],mana:c[4],fx:c[6],leg:c[5]==='Leggendario',art:'<g transform="translate(0 2)">'+CGI[c[0]]+'</g>'}));
  if(cgT==='cmd')CGK.forEach((c,k)=>L.push({i:'k'+k,n:f?c[1]:c[2],role:'Comandante · '+c[3],cp:1,mana:1,fx:c[4],leg:true,art:cgCmdArt(c[0],f)}));

const cgInf=id=>({mago_rana:'zucca',gufo_procione:'sauron',pollo_chitarra:'teschio',golem_difensore:'gargoyle',coniglio_samurai:'spaventapasseri',golem_gigante:'beholder',minotauro:'demone',gnomo_barile:'spettro'})[id]||id;
function cgCmdArt(id,f){const T=CGF[cgF];return'<g transform="translate(0 -4) scale(.78) translate(11 14)">'+cgBody(f?'#2f8f83':'#5b2a78')+cgFace(f?'#f0c9a0':'#c9bfd6',18,17)+cgE(43,40,4.4)+cgE(57,40,4.4)+cgMouth(7,50)+'<path d="M32 28L36 12L43 22L50 8L57 22L64 12L68 28Z" fill="#ffd34a" stroke="'+CG_INK+'" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(60 4) scale(.38)">'+CGI[id]+'</g>'}
function cgZoom(id){const L=cgItems(),o=L.find(x=>x.i===id);if(!o)return;const z=document.createElement('div');z.className='cgz';z.innerHTML='<div class="cgzi">'+cgCard(Object.assign({},o,{big:true}))+'<button class="cgzx">Chiudi</button></div>';z.onclick=e=>{if(e.target===z||e.target.closest('.cgzx'))z.remove()};document.body.appendChild(z)}

  const r=$('#root');$('[data-gb]').onclick=showGames;

/* ---------- TABELLONE: partita in due sullo stesso telefono ---------- */
let TG=null;
const tbRnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const tbShuf=a=>{for(let i=a.length-1;i>0;i--){const j=tbRnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const tbCd=c=>c.t==='c'?CGC[c.i]:c.t==='l'?CGL[c.i]:CGS[c.i];
const tbNm=c=>{const a=tbCd(c);return c.f==='f'?a[1]:a[2]};
const tbLeg=c=>c.t==='l'?CGL[c.i][5]==='Leggendario':c.t==='s'?CGS[c.i][5]==='Leggendario':false;
const tbCost=c=>c.t==='c'?CGC[c.i][5]:c.t==='l'?CGL[c.i][4]:CGS[c.i][4];
const tbDef=c=>CGC[c.i][7]+c.pd;
const tbPFac=p=>p?'i':'f';
function tbDeck(f){const d=[];CGC.forEach((x,i)=>{for(let k=0;k<x[4];k++)d.push({t:'c',i,f})});CGL.forEach((x,i)=>{for(let k=0;k<x[3];k++)d.push({t:'l',i,f})});CGS.forEach((x,i)=>{for(let k=0;k<x[3];k++)d.push({t:'s',i,f})});return tbShuf(d)}
const tbNewCre=card=>({i:card.i,f:card.f,dmg:0,ready:true,tb:0,pa:0,pd:0,trained:false,guest:false,guide:null,ic:false});
const tbEmpty=()=>({main:null,plc:null,seal:null,bard:null});
function tbNew(){TG={stage:'cmd',cp:0,P:[0,1].map(p=>({f:tbPFac(p),cmd:null,life:25,mana:0,deck:tbDeck(tbPFac(p)),hand:[],disc:[],cmdUsed:false,discUsed:false,placeMana:false,mull:false})),F:[0,1].map(()=>[0,1,2,3].map(tbEmpty)),cur:0,turnNo:0,pend:null,ov:null,modal:null,hidden:false,over:null,log:[],firstTurn:false,exit:false}}
const tbLog=s=>{TG.log.push(s);if(TG.log.length>60)TG.log.shift()};
function tbDraw(p,n=1){const P=TG.P[p];let k=0;for(let j=0;j<n;j++){if(!P.deck.length)break;P.hand.push(P.deck.pop());k++}return k}
/* ----- utilità ----- */
const tbCre=(p,l,s)=>TG.F[p][l][s];
function tbCreList(p){const o=[];TG.F[p].forEach((f,l)=>{if(f.main&&!f.main.guest)o.push({k:'cre:'+p+':'+l+':main',c:f.main,p,l,slot:'main'});if(f.bard)o.push({k:'cre:'+p+':'+l+':bard',c:f.bard,p,l,slot:'bard'})});return o}
function tbAtk(c,p,l){let a=CGC[c.i][6]+c.pa+c.tb;const f=TG.F[p][l];if(f.plc&&f.plc.i===0&&(f.main===c||(!f.main&&f.bard===c)))a+=1;return Math.max(0,a)}
function tbCanEnter(p,l,c){const s=TG.F[p][l].seal;if(!s)return true;if(s.type==='campo')return false;if(s.type==='barr'&&c.t==='c'&&c.i===5)return false;if(s.type==='anticav'&&c.t==='c'&&c.i===8)return false;return true}
function tbDisc(p,c){TG.P[p].disc.push({t:'c',i:c.i,f:c.f});if(c.guide)TG.P[p].disc.push({t:'c',i:c.guide.i,f:c.guide.f})}
function tbKill(p,l,slot){const f=TG.F[p][l],c=f[slot];if(!c)return;f[slot]=null;tbDisc(p,c);tbLog(tbNm(c)+' è stato distrutto.')}
function tbDeaths(){let n=0;for(let p=0;p<2;p++)TG.F[p].forEach((f,l)=>{['main','bard'].forEach(s=>{const c=f[s];if(c&&c.dmg>=tbDef(c)){tbKill(p,l,s);n++}})});return n}
function tbCheckOver(){for(let p=0;p<2;p++)if(TG.P[p].life<=0&&TG.over==null)TG.over=1-p}
function tbReleaseGuest(p,l){const f=TG.F[p][l];if(f.plc&&f.plc.guest){const g=f.plc.guest;g.guest=false;g.ready=false;f.plc.guest=null}}
function tbRemovePlace(p,l){const f=TG.F[p][l];if(!f.plc)return;tbReleaseGuest(p,l);TG.P[p].disc.push({t:'l',i:f.plc.i,f:f.plc.f});tbLog(tbNm({t:'l',i:f.plc.i,f:f.plc.f})+' è stato demolito.');f.plc=null}
const tbDiscountOK=p=>{const P=TG.P[p];return!P.discUsed&&TG.F[p].some(f=>f.main&&f.main.i===0&&!f.main.guest)};
function tbSpellCost(p,c){let k=tbCost(c);if(c.t==='s'&&!tbLeg(c)&&tbDiscountOK(p)&&k>0)k-=1;return k}
/* ----- avvio turno / fine turno ----- */
function tbStartTurn(){const p=TG.cur,P=TG.P[p];TG.turnNo++;
  TG.F[p].forEach((f,l)=>{['main','bard'].forEach(s=>{if(f[s])f[s].ready=true});if(f.plc)f.plc.ready=true});
  P.cmdUsed=false;P.discUsed=false;P.placeMana=false;
  TG.F[p].forEach(f=>{if(f.plc&&f.plc.guest){const g=f.plc.guest,acc=f.plc.i===5;g.guest=false;g.ready=true;g.dmg=Math.max(0,g.dmg-2);if(acc)g.pa+=1;else g.pd+=2;g.trained=true;f.plc.guest=null;tbLog(tbNm({t:'c',i:g.i,f:g.f})+' esce dal '+(acc?'addestramento':'riposo')+'.')}});
  P.mana=2;tbDraw(p,1);tbLog('Turno '+TG.turnNo+': '+(p?'Inferi':'Fantasy')+'.');TG.hidden=false}
function tbEndTurn(){const p=TG.cur;
  for(let q=0;q<2;q++)TG.F[q].forEach(f=>{['main','bard'].forEach(s=>{if(f[s]){f[s].tb=0;f[s].ic=false}});if(f.seal&&f.seal.until&&f.seal.until===TG.turnNo)f.seal=null});
  TG.P[p].mana=0;TG.pend=null;TG.firstTurn=false;TG.cur=1-p;TG.hidden=true}
/* ----- azioni: giocare carte ----- */
function tbPlayCands(p,card){const i=card.i,res=[],side=TG.F[p];
  for(let l=0;l<4;l++){const f=side[l];
    if(card.t==='c'){if(!tbCanEnter(p,l,card))continue;
      if(i===2){const ob=side.findIndex(x=>x.bard);if(ob>=0){if(ob===l&&f.bard.ready)res.push(l)}else res.push(l);continue}
      if(i===8||i===5){const m=f.main,need=i===8?1:0;if(m&&m.ready&&!m.guest&&m.i===need&&!m.guide)res.push(l);continue}
      if(!f.main||(f.main.ready&&!f.main.guest))res.push(l)}
    else if(card.t==='l'){if(tbLeg(card)){const ol=side.findIndex(x=>x.plc&&CGL[x.plc.i][5]==='Leggendario');if(ol>=0&&ol!==l)continue}res.push(l)}}
  return res}
function tbSetPend(msg,cands,pick){TG.pend={msg,cands,pick}}
function tbDone(){TG.pend=null;tbDeaths();tbCheckOver();if(TG.over!=null)TG.stage='over'}
function tbHandIdx(card){return TG.P[TG.cur].hand.indexOf(card)}
function tbPlay(card){const p=TG.cur,P=TG.P[p];if(TG.pend||TG.over!=null)return;
  const cost=card.t==='s'?tbSpellCost(p,card):tbCost(card);
  if(cost>P.mana)return toast('Mana insufficiente');
  const pay=()=>{const k=tbHandIdx(card);if(k>=0)P.hand.splice(k,1);if(card.t==='s')P.disc.push(card);P.mana-=cost;if(card.t==='s'&&!tbLeg(card)&&cost<tbCost(card))P.discUsed=true};
  if(card.t==='c'||card.t==='l'){
    const cs=tbPlayCands(p,card);if(!cs.length)return toast('Nessun campo valido');
    tbSetPend('Scegli il campo per '+tbNm(card),cs.map(l=>'fld:'+p+':'+l),key=>{const l=+key.split(':')[2];const f=TG.F[p][l];pay();
      if(card.t==='l'){if(f.plc)tbRemovePlace(p,l);f.plc={i:card.i,f:card.f,ready:true,guest:null};tbLog(tbNm(card)+' giocato.');tbDone();return}
      const c=tbNewCre(card);
      if(card.i===2){if(f.bard)tbDisc(p,f.bard);f.bard=c}
      else if(card.i===8||card.i===5){c.guide=f.main;f.main=c}
      else{if(f.main)tbDisc(p,f.main);f.main=c}
      tbLog(tbNm(card)+' entra in campo.');
      if(card.i===5){const ts=tbCreList(1-p);if(ts.length){tbSetPend('Beholder/Golem: 1 danno a una creatura nemica',ts.map(x=>x.k),k2=>{const t=ts.find(x=>x.k===k2);t.c.dmg+=1;tbLog('1 danno a '+tbNm({t:'c',i:t.c.i,f:t.c.f})+'.');tbDone();tbRender()});tbRender();return}}
      tbDone()});
    return tbRender()}
  tbSpell(card,pay)}
function tbSpell(card,pay){const p=TG.cur,o=1-p,k=card.i;
  const ask=(msg,cands,fn)=>{if(!cands.length)return toast('Nessun bersaglio valido');tbSetPend(msg,cands,key=>{pay();fn(key);tbDone();tbRender()});tbRender()};
  const parse=key=>key.split(':');
  const cre=key=>{const[,pp,l,s]=parse(key);return{p:+pp,l:+l,s,c:TG.F[+pp][+l][s]}};
  const en=tbCreList(o),mine=tbCreList(p);
  if(k===0||k===4){const n=k===0?2:4;return ask('Scegli la creatura nemica',en.map(x=>x.k),key=>{const t=cre(key);t.c.dmg+=n;tbLog(tbNm(card)+': '+n+' danni a '+tbNm({t:'c',i:t.c.i,f:t.c.f})+'.')})}
  if(k===1)return ask('Scegli la tua creatura ferita',mine.filter(x=>x.c.dmg>0).map(x=>x.k),key=>{const t=cre(key);t.c.dmg=Math.max(0,t.c.dmg-3);tbLog(tbNm(card)+': cura 3.')});
  if(k===2)return ask('Scegli la tua creatura',mine.map(x=>x.k),key=>{cre(key).c.tb+=2;tbLog(tbNm(card)+': +2 ATK.')});
  if(k===3)return ask('Scegli la creatura nemica',en.map(x=>x.k),key=>{cre(key).c.tb-=2;tbLog(tbNm(card)+': −2 ATK.')});
  if(k>=5&&k<=7){const type=['barr','anticav','campo'][k-5],cs=[];for(let q=0;q<2;q++)for(let l=0;l<4;l++)if(!TG.F[q][l].seal)cs.push('fld:'+q+':'+l);
    return ask('Scegli il campo da sigillare',cs,key=>{const[,q,l]=parse(key);let until=null;if(type==='campo')until=(+q===p)?TG.turnNo+2:TG.turnNo+1;TG.F[+q][+l].seal={type,until};tbLog(tbNm(card)+' lanciato.')})}
  if(k===8){const cs=[];for(let q=0;q<2;q++)for(let l=0;l<4;l++)if(TG.F[q][l].seal)cs.push('sea:'+q+':'+l);return ask('Scegli il sigillo da rimuovere',cs,key=>{const[,q,l]=parse(key);TG.F[+q][+l].seal=null;tbLog('Sigillo rimosso.')})}
  if(k===9){const cs=[];for(let q=0;q<2;q++)for(let l=0;l<4;l++)if(TG.F[q][l].plc)cs.push('plc:'+q+':'+l);return ask('Scegli il luogo da demolire',cs,key=>{const[,q,l]=parse(key);tbRemovePlace(+q,+l)})}
  if(k===10){const cs=[];for(let l=0;l<4;l++)if([0,1].some(q=>TG.F[q][l].main||TG.F[q][l].bard||TG.F[q][l].plc))cs.push('lan:'+l);
    return ask('Scegli la corsia',cs,key=>{const l=+parse(key)[1];tbLog('Vulcano sulla corsia '+(l+1)+'!');for(let q=0;q<2;q++)tbRemovePlace(q,l);for(let q=0;q<2;q++){const f=TG.F[q][l];if(f.main)f.main.dmg+=3;if(f.bard)f.bard.dmg+=3}})}
  if(k===11){const P=TG.P[p],ix=[];P.disc.forEach((c,i)=>{if(c.t==='c'&&c.i!==8&&c.i!==5)ix.push(i)});if(!ix.length)return toast('Niente da far rinascere');
    TG.ov={type:'disc',ix};TG.rin={card,pay};return tbRender()}}
function tbRinPick(i){const p=TG.cur,P=TG.P[p],dc=P.disc[i],card=TG.rin.card,pay=TG.rin.pay;TG.ov=null;

  if(/\b(meteo|tempo|piove|piover[aà]?|pioggia|ombrello|temperatura|luna|lunare|nuvol\w*|sole|freddo|caldo|gradi|neve|vento)\b/.test(t)&&!/\b(spes\w*|euro|pagat\w*|speso)\b/.test(t))return await weatherCommand(raw);
  if(!inner&&!BRFIN.test(t)&&!findAmount(t)){if(fz)return UNK;const r=await fuzzyRetry(raw,t);return r!==null?r:brainUnknown(raw)}
  if(fz)return UNK;
  if(!S)return'Per inserire le finanze devi prima entrare una volta in Finanze con email, password e PIN.';
  let st;try{st=await rpc('pin_status')}catch{return'Sessione scaduta: apri Finanze e rientra.'}
  if(st!=='verified')return'Apri Finanze e inserisci il PIN, poi potrò scrivere le spese da qui.';
  if(!D.exp.length&&!D.inc.length)await loadAll();
  if(/\b(apri|vai|mostra|portami)\b/.test(t)&&/finanz|spese|spesa|fisse|cicli|home|principale|stipendi|statistic/.test(t)){
    const m={spese:'spese',spesa:'spese',fisse:'fisse',cicli:'cicli',stipendi:'cicli',statistiche:'cicli',statistica:'cicli'};let tb='home';for(const w of t.split(' '))if(m[w]){tb=m[w];break}
    closeSheet();tab=tb;openApp($('#sq-finanze'),'fin');return'Apro Finanze.';
  }
  const out=await command(raw);
  if(!inner&&/^Non ho capito/.test(out)){const r=await fuzzyRetry(raw,t);return r!==null?r:brainUnknown(raw)}
  if(/^(Aggiunta spesa|Stipendio registrato|Entrata registrata|Tolta)/.test(out))PEND={kind:'fin',apply:()=>setTab('spese')};
  return out;
}

let aiT=null,aiH=null,gzT=null;
function aiSet(st){const h=$('#hub');if(h&&h.dataset.ai!==st)h.dataset.ai=st}
function aiCap(txt,hold){
  const c=$('#aicap');if(!c)return;clearInterval(aiT);clearTimeout(aiH);
  if(!txt){c.classList.remove('on');return}
  c.textContent='';c.classList.add('on');let i=0;
  aiT=setInterval(()=>{c.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(aiT);aiH=setTimeout(()=>c.classList.remove('on'),hold||7000)}},26)}
function aiGreet(){
  const h=new Date().getHours(),g=h<5?'Ciao Flavio':h<12?'Buongiorno Flavio':h<18?'Buon pomeriggio Flavio':'Buonasera Flavio';
  paintRem();const near=REM.filter(r=>r.days<=1);let l2='';
  if(near.length)l2=(near[0].days===0?'Oggi':'Domani')+' hai: '+near.slice(0,2).map(r=>r.t).join(' e ')+(near.length>2?' e altro.':'.');
  else{try{const c=lget('flat_wx');const n=c&&Date.now()-c.t<30*60000&&nowcast(c.j);if(n&&/Sta piovendo|in arrivo/.test(n.txt))l2=n.txt}catch{}}
  return g+'.'+(l2?' '+l2:' Tutto tranquillo.')}
function aiWake(){aiSet('wake');setTimeout(()=>{if($('#hub').dataset.ai==='wake')aiSet('idle')},2600);aiCap(aiGreet())}
addEventListener('pointermove',e=>{

  h.style.setProperty('--gx',(dx/d*4*k).toFixed(2));h.style.setProperty('--gy',(dy/d*4*k).toFixed(2));

/* ragnatela: fili sottilissimi tra triangolo e forme, seguono il movimento ma non girano */
(function(){
  const svg=$('#web'),NS='http://www.w3.org/2000/svg',ids=['sq-finanze','ov-meteo','ci-ash','re-cal','qd-task','mu-music','ap-app'];
  const mk=(t,c)=>{const e=document.createElementNS(NS,t);if(c)e.setAttribute('class',c);svg.appendChild(e);return e};
  const rings=ids.map(()=>mk('circle')),spokes=ids.map(()=>mk('line')),links=ids.map(()=>mk('line','nb'));
  function tick(){
    const hub=$('#hub');
    if(!hub.classList.contains('open')||appOpen||document.hidden){setTimeout(tick,400);return}
    const t=$('.tri').getBoundingClientRect(),cx=t.left+t.width/2,cy=t.top+t.height/2;
    const P=ids.map(id=>{const r=$('#'+id).getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]});
    let last=-99;P.map((p,i)=>[Math.hypot(p[0]-cx,p[1]-cy),i]).sort((a,b)=>a[0]-b[0]).forEach(([d,i])=>{const ok=d-last>22;if(ok)last=d;rings[i].style.display=ok?'':'none';rings[i].setAttribute('cx',cx);rings[i].setAttribute('cy',cy);rings[i].setAttribute('r',d)});
    P.forEach((p,i)=>{spokes[i].setAttribute('x1',cx);spokes[i].setAttribute('y1',cy);spokes[i].setAttribute('x2',p[0]);spokes[i].setAttribute('y2',p[1])});
    const ord=P.map((p,i)=>[Math.atan2(p[1]-cy,p[0]-cx),i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    ord.forEach((i,k)=>{const a=P[i],b=P[ord[(k+1)%ord.length]],l=links[k];l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1])});
    requestAnimationFrame(tick);
  }
  tick();
})();
})();
